<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>복복 ⋆.˚</title>
<meta name="description" content="몽롱한 클리셰를 북북 쓰다듬어 주세요." />
<meta property="og:title" content="복복 ⋆.˚" />
<meta property="og:description" content="몽롱한 클리셰를 북북 쓰다듬어 주세요." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Single+Day&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg-1: #4F4A9D;
    --pink: #ffb3c7;
    --pink-soft: #ffd4dd;
    --pink-deep: #e29f90;
    --cream: #fff4e8;
    --gold: #e6c887;
    --lilac: #c9a8e0;
    --ink: #2a1530;
    --star: #fff8e1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Gaegu', system-ui, sans-serif;
    color: var(--cream);
    background: var(--bg-1);
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 메인 레이아웃 */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    z-index: 10;
  }

  header {
    padding: 28px 40px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    pointer-events: none;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand-mark {
    font-family: 'Single Day', cursive;
    font-weight: 400;
    font-size: 38px;
    letter-spacing: 0.01em;
    color: var(--pink-soft);
    text-shadow: 0 0 20px rgba(255, 179, 199, 0.4);
    line-height: 1;
  }
  .brand-mark .accent {
    color: var(--gold);
    font-style: normal;
  }

  .credits {
    font-size: 11px;
    text-align: right;
    color: rgba(255, 244, 232, 0.55);
    letter-spacing: 0.05em;
    line-height: 1.7;
  }
  .credits a {
    color: var(--pink-soft);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255, 212, 221, 0.4);
    transition: color 0.3s, border-color 0.3s;
    pointer-events: auto;
  }
  .credits a:hover {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* 캔버스 컨테이너 */
  .canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    min-height: 0;
  }

  /* 아트보드 1200x400 = 3:1 비율 */
  .canvas-frame {
    position: relative;
    width: min(1100px, 95vw);
    aspect-ratio: 3 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 화면이 좁으면 캔버스가 너무 작아져서, 모바일에선 비율 유지하면서 vh로 캡 */
  @media (max-aspect-ratio: 3/1) {
    .canvas-frame {
      width: 95vw;
    }
  }

  #riveCanvas {
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
    display: block;
  }
  #riveCanvas:active { cursor: grabbing; }

  /* 말풍선 — 각 캐릭터 머리 위에 절대 위치 */
  .bubble {
    position: absolute;
    transform: translate(-50%, -100%);
    background: var(--cream);
    color: var(--ink);
    padding: 8px 14px 9px;
    border-radius: 18px;
    font-size: 18px;
    line-height: 1.3;
    white-space: nowrap;
    max-width: 260px;
    text-align: center;
    pointer-events: none;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25), 0 0 0 2px var(--bubble-color, var(--pink));
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: 30;
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    /* 살짝 띄움 */
    margin-top: -8px;
  }
  .bubble.visible {
    opacity: 1;
    animation: bubble-float 3s ease-in-out infinite;
  }
  @keyframes bubble-float {
    0%, 100% { transform: translate(-50%, -100%) translateY(0); }
    50% { transform: translate(-50%, -100%) translateY(-4px); }
  }
  /* 말풍선 꼬리 */
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid var(--bubble-color, var(--pink));
  }
  .bubble::before {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid var(--cream);
    z-index: 1;
  }

  /* 로딩 */
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.6s ease;
    z-index: 5;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading-text {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 18px;
    color: var(--pink-soft);
    letter-spacing: 0.05em;
  }
  .loading-dots {
    display: flex;
    gap: 6px;
  }
  .loading-dots span {
    width: 8px;
    height: 8px;
    background: var(--pink);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-10px); opacity: 1; }
  }

  /* HUD - 4명 인텐시티 표시 */
  .hud {
    position: absolute;
    left: 24px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 244, 232, 0.55);
    pointer-events: none;
    z-index: 20;
  }
  .hud-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hud-name {
    width: 56px;
    text-align: right;
    font-family: 'Gaegu';
    font-size: 11px;
    letter-spacing: 0;
    text-transform: none;
    color: rgba(255, 244, 232, 0.7);
  }
  .hud-bar {
    position: relative;
    width: 90px;
    height: 2px;
    background: rgba(255, 244, 232, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .hud-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  /* 푸터 / 안내 */
  footer {
    padding: 16px 40px 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }
  .hint {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 15px;
    color: rgba(255, 212, 221, 0.7);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hint::before, .hint::after {
    content: '';
    width: 30px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 212, 221, 0.3), transparent);
  }

  /* 반응형 */
  @media (max-width: 720px) {
    header { padding: 18px 20px 0; flex-direction: column; gap: 8px; }
    .brand-mark { font-size: 30px; }
    .credits { text-align: left; font-size: 10px; }
    .hud { left: 16px; bottom: 16px; font-size: 9px; }
    .hud-bar { width: 60px; }
    .hud-name { width: 44px; font-size: 11px; }
    .bubble { font-size: 14px; padding: 5px 10px 6px; max-width: 160px; white-space: normal; }
    .hint { font-size: 13px; }
    footer { padding: 12px 20px 18px; }
  }
</style>
</head>
<body>

  <main class="stage" id="stage">
    <header>
      <div class="brand">
        <div class="brand-mark">bokbok⋆˚</div>
      </div>
      <div class="credits">
        artwork &amp; animation by <a href="https://x.com/minarii_0" target="_blank" rel="noopener">@minarii_0</a><br />
        <span style="opacity:0.7">stellive cliché</span>
      </div>
    </header>

    <section class="canvas-wrap">
      <div class="canvas-frame" id="canvasFrame">
        <div class="loading" id="loading">
          <div class="loading-text">cliché is coming ...</div>
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
        <canvas id="riveCanvas" width="1200" height="400" aria-label="졸린 클리셰 멤버들을 쓰다듬어 깨워주세요"></canvas>

        <!-- 말풍선들 (JS가 위치/내용 채움) -->
        <div class="bubble" id="bubble-nana" style="--bubble-color: #ffb3c7"></div>
        <div class="bubble" id="bubble-riko" style="--bubble-color: #a8d8b9"></div>
        <div class="bubble" id="bubble-shibuki" style="--bubble-color: #c9a8e0"></div>
        <div class="bubble" id="bubble-morin" style="--bubble-color: #b8e3f0"></div>
      </div>

      <div class="hud" aria-hidden="true">
        <div class="hud-row">
          <span class="hud-name">나나</span>
          <div class="hud-bar"><div class="hud-fill" id="fill-nana" style="background: linear-gradient(90deg, #ffb3c7, #ffd4dd); box-shadow: 0 0 6px #ffb3c7;"></div></div>
        </div>
        <div class="hud-row">
          <span class="hud-name">리코</span>
          <div class="hud-bar"><div class="hud-fill" id="fill-riko" style="background: linear-gradient(90deg, #a8d8b9, #d4f0dc); box-shadow: 0 0 6px #a8d8b9;"></div></div>
        </div>
        <div class="hud-row">
          <span class="hud-name">부키</span>
          <div class="hud-bar"><div class="hud-fill" id="fill-shibuki" style="background: linear-gradient(90deg, #c9a8e0, #e0c8ee); box-shadow: 0 0 6px #c9a8e0;"></div></div>
        </div>
        <div class="hud-row">
          <span class="hud-name">린</span>
          <div class="hud-bar"><div class="hud-fill" id="fill-morin" style="background: linear-gradient(90deg, #b8e3f0, #d8eff5); box-shadow: 0 0 6px #b8e3f0;"></div></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/@rive-app/canvas@2.37.6"></script>
  <script src="app.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
